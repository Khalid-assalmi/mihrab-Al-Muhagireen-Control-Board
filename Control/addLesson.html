<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/all.min.css">
    <title>mihrab Al-Muhagireen \ Add Lesson</title>
</head>
<body dir="rtl">
    <header>
        <div>
            <label onclick="window.history.go(-1)" title="عودة" ><i class="fa-solid fa-arrow-right"></i></label>
            <h3>إضافة درس</h3>
        </div>
    </header>

    <div class="inputs">
        <input type="text" placeholder="اسم الدرس" id="name">
        <select id="status">
            <option value="continuous">مستمر</option>
            <option value="disContinuous">غير مستمر</option>
        </select>
        <textarea placeholder="اكتب الدرس هنا ..." id="description"></textarea>
    </div>
    <button class="addButton" onclick="saveData('lessons', document.getElementById('name').value, document.getElementById('status').value, document.getElementById('description').value)">إضافة الدرس</button>

    <script src="../manage.js"></script>
</body>
</html>
